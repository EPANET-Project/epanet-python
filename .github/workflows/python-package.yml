name: Build Wheels

on: [push, pull_request]

jobs:
  build_nrtest_plugin:
    name: Build nrtest-epanet plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nrtest-epanet

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8

      - name: Build wheel
        run: |
          python -m pip install hatchling
          hatchling build

      - uses: actions/upload-artifact@v4
        with:
          name: nrtest-epanet-wheel
          path: nrtest-epanet/dist/*.whl

  build_toolkit_linux:
    name: Build wheels on linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install
        env:
          DOCKER_IMAGE: dockcross/manylinux2014-x64
        run: |
          docker pull $DOCKER_IMAGE
          docker run --rm $DOCKER_IMAGE > ./dockcross
          chmod +x ./dockcross

      - name: Script
        run: ./dockcross epanet-toolkit/tools/build-wheels.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux
          path: ./dist/*.manylinux2014_x86_64.whl

  build_toolkit_win-mac:
    name: Build ${{ matrix.os }} python ${{ matrix.py }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./epanet-toolkit
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        py: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.py }}

      - name: Build wheel in virtual env
        run: |
          python -m pip install build
          python -m build

      - name: Test wheel
        run: |
          pip install hatch
          hatch run test:pytest

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.py }}
          path: epanet-toolkit/dist/*.whl

  merge-artifacts:
    name: Merge artifacts
    runs-on: ubuntu-latest
    needs: [build_toolkit_linux, build_toolkit_win-mac]
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: merged-artifacts
          delete-merged: true
          pattern: wheels-*
